name: Backup PostgreSQL para Backblaze B2 (manual)

# Primeira fase: somente disparo manual na main.
# NÃO executar automaticamente, nem em push/PR, até backup e RESTAURAÇÃO serem validados.
# O workflow lê o banco e envia os dumps ao B2; não executa SQL de escrita.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Para exportar produção e enviar ao B2, digite iniciar-backup"
        required: true
        type: string

permissions: {}

concurrency:
  group: backup-producao
  cancel-in-progress: false

jobs:
  validar:
    name: Validar autorização e origem (sem secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir repository, branch e confirmação
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "evandroantunesb/Evandro---CRM" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Backup permitido somente no repositório esperado e na branch main"
            exit 1
          fi
          if [[ "$CONFIRMACAO" != "iniciar-backup" ]]; then
            echo "::error::Confirmação inválida; nenhuma credencial foi acessada"
            exit 1
          fi

  backup:
    name: Exportar PostgreSQL e armazenar no B2
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: backup-producao
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Validar destinos, exportar e enviar (sem registrar credenciais)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          SUPABASE_PROJECT_ID: wswpxdmgfdamvqhyztrm
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.B2_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: |
          set -euo pipefail
          umask 077
          for variavel in SUPABASE_DB_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION B2_BUCKET B2_ENDPOINT; do
            if [[ -z "${!variavel:-}" ]]; then
              echo "::error::Configuração ausente: $variavel (environment backup-producao)"
              exit 1
            fi
          done

          # Reutiliza a proteção já usada pelo Raion em migrations de produção:
          # projeto ref, username no session pooler, host oficial, porta 5432 e DB postgres.
          node .github/scripts/validar-destino-producao.mjs banco wswpxdmgfdamvqhyztrm

          if [[ "$B2_ENDPOINT" != "https://s3.us-east-005.backblazeb2.com" || "$AWS_DEFAULT_REGION" != "us-east-005" ]]; then
            echo "::error::Endpoint/região B2 diferentes do destino previamente aprovado"
            exit 1
          fi
          if [[ ! "$B2_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{2,61}[a-z0-9]$ ]]; then
            echo "::error::B2_BUCKET ausente ou com formato inesperado"
            exit 1
          fi
          command -v aws >/dev/null || { echo "::error::AWS CLI não disponível no runner"; exit 1; }

          # Falhar antes de exportar se a chave não puder ler o bucket informado.
          aws s3api head-bucket --bucket "$B2_BUCKET" --endpoint-url "$B2_ENDPOINT" >/dev/null

          pasta="$(mktemp -d "$RUNNER_TEMP/raion-backup.XXXXXXXX")"
          trap 'rm -rf "$pasta"' EXIT

          # Dump lógico em 3 partes conforme documentação de backup do Supabase.
          # A CLI executa pg_dump com filtros próprios para schemas gerenciados.
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$pasta/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$pasta/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$pasta/data.sql" --data-only --use-copy \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"

          for arquivo in roles.sql schema.sql data.sql; do
            [[ -s "$pasta/$arquivo" ]] || { echo "::error::Arquivo de dump ausente/vazio: $arquivo"; exit 1; }
          done

          data_utc="$(date -u +%Y%m%dT%H%M%SZ)"
          printf 'projeto=wswpxdmgfdamvqhyztrm\ninstante_utc=%s\ncli=2.120.0\n' "$data_utc" > "$pasta/info.txt"
          tar -C "$pasta" -czf "$pasta/backup.tar.gz" roles.sql schema.sql data.sql info.txt
          (cd "$pasta" && sha256sum backup.tar.gz > sha256.txt && sha256sum -c sha256.txt)

          chave="postgres/$data_utc/run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          aws s3 cp "$pasta/backup.tar.gz" "s3://$B2_BUCKET/$chave/backup.tar.gz" \
            --sse AES256 --endpoint-url "$B2_ENDPOINT" --only-show-errors --no-progress

          tamanho_local="$(stat -c %s "$pasta/backup.tar.gz")"
          tamanho_remoto="$(aws s3api head-object --bucket "$B2_BUCKET" --key "$chave/backup.tar.gz" \
            --endpoint-url "$B2_ENDPOINT" --query ContentLength --output text)"
          [[ "$tamanho_local" == "$tamanho_remoto" ]] || { echo "::error::Tamanho remoto não confere"; exit 1; }

          # Publica o checksum somente após confirmar que o objeto principal existe.
          aws s3 cp "$pasta/sha256.txt" "s3://$B2_BUCKET/$chave/sha256.txt" \
            --sse AES256 --endpoint-url "$B2_ENDPOINT" --only-show-errors --no-progress

          {
            echo "### Backup PostgreSQL enviado ao Backblaze B2"
            echo
            echo "- Projeto conferido: \`wswpxdmgfdamvqhyztrm\`"
            echo "- Prefixo B2: \`$chave/\`"
            echo "- Tamanho do arquivo confirmado: $tamanho_local bytes"
            echo "- Checksum SHA-256 armazenado ao lado do arquivo"
            echo
            echo "**Isto NÃO comprova que a restauração funciona.** Antes de liberar migrations,"
            echo "baixar o arquivo, validar o hash e restaurar em banco isolado."
            echo "Escopo: dumps lógicos Supabase; objetos físicos do Storage não estão incluídos."
          } >> "$GITHUB_STEP_SUMMARY"
