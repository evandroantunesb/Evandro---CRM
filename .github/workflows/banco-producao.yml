name: Banco de produção

# Aplica as migrations novas no Supabase de produção quando algo entra na main.
# Precisa dos secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID e
# SUPABASE_DB_URL (connection string da Session pooler, porta 5432, com a senha já
# percent-encoded — runners do GitHub Actions são IPv4-only e a conexão direta do Supabase
# só resolve em IPv6 sem o add-on pago de IPv4).
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: banco-producao
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Conferir secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Configure os secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID e SUPABASE_DB_URL no GitHub."
            exit 1
          fi
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
