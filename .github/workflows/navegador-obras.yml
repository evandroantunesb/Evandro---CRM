name: Navegador (Obras)

# Testes de navegador (Playwright) do módulo Obras contra o Supabase LOCAL do próprio runner,
# com base 100% fictícia (e2e/base-ficticia.ts). Sem nenhum secret, sem environment, sem
# deploy, sem acesso a Supabase remoto: a trava fail-closed (scripts/lib/guard-supabase-local.mjs)
# roda no playwright.config.ts, no global-setup e de novo quando o Playwright sobe o app
# (webServer do playwright.config.ts). Este arquivo não sobe o app diretamente.
# Capturas de tela e relatório ficam como artefatos (retenção curta). Em falha, as linhas de
# erro viram anotações do job (só dados fictícios e do Supabase local).
#
# Sob demanda (decisão do Evandro, 13/11/2026: o job era quase metade dos minutos do Actions):
# roda numa PR com a etiqueta "navegador" (ao pôr a etiqueta e a cada push enquanto ela estiver lá)
# ou pelo disparo manual (Run workflow / `gh workflow run navegador-obras.yml --ref <branch>`).
# Ponha a etiqueta quando a PR mexer em Obras, Engenharia, e2e, na trava ou no servidor do e2e
# (scripts/lib, scripts/e2e-servidor.mjs, playwright.config.ts), em next.config.ts, nas dependências
# ou em supabase/**. Sem a etiqueta o job fica "pulado" e não gasta minutos.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador:
    # Pôr outra etiqueta numa PR que já tem "navegador" não roda de novo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'navegador') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'navegador'))
    # No job, e não no workflow: uma execução pulada (outra etiqueta) não cancela a que está rodando.
    concurrency:
      group: navegador-obras-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      # O Supabase CLI publica as portas sem IP (`-p <porta>:<porta-interna>`) numa rede bridge PERSONALIZADA
      # (supabase_network_<id>). O padrão do Docker é 0.0.0.0/::, e a opção "ip" do daemon só vale para a bridge
      # padrão. Para redes novas o padrão vem de "default-network-opts" (host_binding_ipv4), que só afeta redes
      # criadas DEPOIS dele: por isso este passo vem ANTES do `supabase start`. Runner descartável do GitHub.
      - name: Docker - publicar redes bridge novas só em 127.0.0.1
        run: |
          set -euo pipefail
          if docker network ls --format '{{.Name}}' | grep -q '^supabase_network_'; then
            echo "::error::Já existe uma rede supabase_network_* neste runner: ela manteria a publicação antiga."
            exit 1
          fi
          conf=/etc/docker/daemon.json
          novo="$(mktemp)"
          if sudo test -s "$conf"; then base="$(sudo cat "$conf")"; else base='{}'; fi
          printf '%s' "$base" | jq '.["default-network-opts"].bridge["com.docker.network.bridge.host_binding_ipv4"] = "127.0.0.1"' > "$novo"
          jq -e '.["default-network-opts"].bridge["com.docker.network.bridge.host_binding_ipv4"] == "127.0.0.1"' "$novo" > /dev/null
          sudo dockerd --validate --config-file="$novo"
          sudo install -m 0644 -o root -g root "$novo" "$conf"
          echo "daemon.json (chaves): $(jq -c 'keys' "$novo")"
          sudo systemctl restart docker
          for _ in $(seq 1 60); do
            if docker info > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! docker info > /dev/null 2>&1; then
            echo "::error::O Docker não voltou a responder em 60 s após a reinicialização."
            exit 1
          fi
          # Prova do efeito: uma rede nova, criada sem opções, precisa nascer com o IP de publicação em loopback.
          docker network create --driver bridge sonda-loopback > /dev/null
          efetivo="$(docker network inspect sonda-loopback --format '{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}')"
          docker network rm sonda-loopback > /dev/null
          if [ "$efetivo" != "127.0.0.1" ]; then
            echo "::error::O Docker não aplicou default-network-opts a redes novas (host_binding_ipv4 efetivo: '${efetivo}')."
            docker version --format 'Docker Engine {{.Server.Version}}'
            exit 1
          fi
          echo "Rede nova nasce com host_binding_ipv4=127.0.0.1 (Docker Engine $(docker version --format '{{.Server.Version}}'))."
      - name: Subir o Supabase local
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
      # Conferência explícita das portas reais antes de qualquer teste. Quem decide é a trava fail-closed
      # (scripts/lib/docker-stack-local.mjs, em `scripts/e2e-servidor.mjs`); isto só falha cedo e mostra IP e porta.
      - name: Conferir as portas publicadas (Kong e PostgreSQL só em loopback)
        run: |
          set -euo pipefail
          projeto="$(awk -F'"' '/^\[/{exit} /^project_id[[:space:]]*=/{print $2; exit}' supabase/config.toml)"
          if [ -z "$projeto" ]; then echo "::error::project_id ausente no supabase/config.toml"; exit 1; fi
          rede="$(docker network inspect "supabase_network_${projeto}" --format '{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}')"
          if [ "$rede" != "127.0.0.1" ]; then
            echo "::error::A rede supabase_network_${projeto} não herdou host_binding_ipv4=127.0.0.1 (efetivo: '${rede}')."
            exit 1
          fi
          # O IP que o Docker precisa publicar é o do host LITERAL da URL que os testes usam (a do CLI): publicar
          # só em ::1 não prova que 127.0.0.1:<porta> é este contêiner, e vice-versa. Nunca imprime as URLs.
          eval "$(supabase status -o env | grep -E '^(API_URL|DB_URL)=')"
          ip_da_url() {
            local host
            host="$(printf '%s' "$1" | sed -E 's#^[a-z]+://([^@/]*@)?(\[[^]]+\]|[^:/]+).*#\2#')"
            case "$host" in
              127.0.0.1) echo "127.0.0.1" ;;
              "[::1]") echo "::1" ;;
              *) echo "::error::O host da URL do Supabase local não é 127.0.0.1 nem [::1]: não há como comprovar o destino no Docker." >&2; return 1 ;;
            esac
          }
          ip_api="$(ip_da_url "$API_URL")"
          ip_db="$(ip_da_url "$DB_URL")"
          conferir() {
            local nome="$1" porta="$2" ip="$3" ligacoes
            ligacoes="$(docker inspect "$nome" | jq -c --arg p "$porta" '.[0].NetworkSettings.Ports[$p]')"
            if ! printf '%s' "$ligacoes" | jq -e --arg ip "$ip" 'type == "array" and length > 0 and all(.[]; .HostIp == "127.0.0.1" or .HostIp == "::1") and any(.[]; .HostIp == $ip)' > /dev/null; then
              echo "::error::${nome} não publica ${porta} só em loopback incluindo ${ip} (endereço da URL do CLI): $(printf '%s' "$ligacoes" | jq -r 'if type == "array" then [.[] | "\(.HostIp):\(.HostPort)"] | join(", ") else "nenhuma publicação" end')"
              exit 1
            fi
            echo "${nome} ${porta}: $(printf '%s' "$ligacoes" | jq -r '[.[] | "\(.HostIp):\(.HostPort)"] | join(", ")') (exigido: ${ip})"
          }
          conferir "supabase_kong_${projeto}" "8000/tcp" "$ip_api"
          conferir "supabase_db_${projeto}" "5432/tcp" "$ip_db"
      - name: Gerar .env.local (só valores do Supabase local)
        run: |
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=' > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local
      - run: pnpm build
      - name: Instalar o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes de navegador
        run: |
          set -o pipefail
          pnpm exec playwright test 2>&1 | tee e2e-saida.txt
      - name: Erros como anotações
        if: ${{ failure() }}
        run: |
          grep -nE "Error|error:|Erro|Timeout|✘" e2e-saida.txt | head -40 | cut -c1-900 | sed 's/^/::error title=playwright::/' || true
      - name: Publicar capturas de tela
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obras-capturas
          path: e2e-capturas/
          # 2 dias: as capturas servem para conferir a PR logo depois do teste; 7 dias enchiam a cota de
          # armazenamento do Actions (1,5 GB em 05/11/2026) e o envio passava a falhar.
          retention-days: 2
          if-no-files-found: warn
      - name: Publicar relatório e falhas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obras-relatorio
          path: |
            e2e-relatorio/
            e2e-resultados/
          # 2 dias: as capturas servem para conferir a PR logo depois do teste; 7 dias enchiam a cota de
          # armazenamento do Actions (1,5 GB em 05/11/2026) e o envio passava a falhar.
          retention-days: 2
          if-no-files-found: warn
